[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="sentinel-pass"
version="2.0.0"
description="Password security intelligence and attack modeling toolkit"
requires-python=">=3.11"
dependencies=["argon2-cffi>=25.1"]
[project.optional-dependencies]
dev=["pytest>=8"]
[project.scripts]
sentinel-pass="sentinel_pass.cli:main"
[tool.pytest.ini_options]
pythonpath=["."]
